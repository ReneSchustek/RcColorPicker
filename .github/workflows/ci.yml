name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Hinweis zu Integration-Tests:
# Die Integration-Suite (tests/Integration/**) benötigt den Shopware-TestBootstrapper
# mit `addCallingPlugin()` — funktioniert nur in einer kompletten Shopware-Installation,
# nicht im Plugin-Solo-Repo. Sie läuft daher auf einer vollständigen Shopware-Installation via
# `.ai/checker/brief-done-gate.sh` und nicht in GitHub Actions.

jobs:
  quality:
    name: Code-Qualität + Unit-Tests (PHP 8.3)
    runs-on: ubuntu-latest

    steps:
      - name: Quellcode auschecken
        uses: actions/checkout@v5

      - name: PHP 8.3 einrichten
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, xml, ctype, iconv, intl, pdo, pdo_mysql, curl, zip
          tools: composer:v2.9.6

      - name: Composer-Cache laden
        uses: actions/cache@v5
        with:
          path: vendor
          key: ${{ runner.os }}-composer-${{ hashFiles('composer.lock') }}
          restore-keys: ${{ runner.os }}-composer-

      - name: Abhängigkeiten installieren
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Security-Audit
        run: composer audit

      - name: Code-Style prüfen
        run: composer cs-check

      - name: Statische Analyse (PHPStan Level 8)
        run: composer phpstan

      - name: Unit-Tests ausführen
        run: composer test:unit
